services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_campaign_app
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      # Direct host access: http://<server-ip>:3005
      - "${HOST_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/prod.db
      - APP_SECRET=${APP_SECRET:-production-secret-must-be-32-chars-long!}
      - JWT_SECRET=${JWT_SECRET:-production-jwt-secret-secure-random!}
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution:8080}
      - GLOBAL_API_KEY=${GLOBAL_API_KEY:-429683C4C97741}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec-evolution-shared-secret}
    volumes:
      - app_data:/app/prisma
    networks:
      - default
      - dokploy-network
    depends_on:
      - redis
      - evolution

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_campaign_worker
    restart: unless-stopped
    command: npm run worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/prod.db
      - APP_SECRET=${APP_SECRET:-production-secret-must-be-32-chars-long!}
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution:8080}
      - GLOBAL_API_KEY=${GLOBAL_API_KEY:-429683C4C97741}
    volumes:
      - app_data:/app/prisma
    networks:
      - default
    depends_on:
      - redis
      - app

  redis:
    image: redis:7-alpine
    container_name: whatsapp_campaign_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - default
      - dokploy-network

  postgres:
    image: postgres:15-alpine
    container_name: whatsapp_evolution_postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - default
      - dokploy-network

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: whatsapp_evolution_api
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      # Direct host access on 8081 if desired (avoids host 8080 conflict)
      - "${EVOLUTION_PORT:-8081}:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_PUBLIC_URL:-http://evolution:8080}
      - AUTHENTICATION_API_KEY=${GLOBAL_API_KEY:-429683C4C97741}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-postgresql}
      - DATABASE_CONNECTION_URI=${DATABASE_CONNECTION_URI:-postgresql://evolution:evolution_pass@postgres:5432/evolution?schema=public}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v2
      - DATABASE_CLIENT_NAME=evolution_api
      - DATABASE_CLIENT=pg
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CONFIG_SESSION_PHONE_CLIENT=BulkFlow WhatsApp
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      default:
        aliases:
          - evolution
          - evolution-api
          - whatsapp_evolution_api
      dokploy-network:
        aliases:
          - evolution
          - evolution-api
          - whatsapp_evolution_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  app_data:
  redis_data:
  postgres_data:
  evolution_instances:

networks:
  dokploy-network:
    external: true
  default:
